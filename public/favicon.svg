<!--
  The Baz mark as an app icon.

  Standalone rather than the BazMark component, because an icon cannot inherit anything: a
  favicon has no page colour to take `currentColor` from, and iOS composites a home-screen icon
  on whatever it likes, so the tile and both ink colours are written out. The geometry is the
  same mark, scaled from the component's own 256 viewBox — if that changes, this changes with it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Baz">
  <rect width="1024" height="1024" rx="225" fill="#065BEA"/>
  <g transform="translate(122,116) scale(3)">
    <circle cx="120" cy="132" r="78" fill="none" stroke="#FFFFFF" stroke-width="24"/>
    <circle cx="120" cy="132" r="48" fill="#065BEA"/>
    <circle cx="102" cy="132" r="7.5" fill="#FFFFFF"/>
    <circle cx="138" cy="132" r="7.5" fill="#FFFFFF"/>
    <circle cx="188" cy="58" r="16" fill="#FFFFFF"/>
  </g>
</svg>
