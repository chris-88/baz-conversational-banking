<!--
  Baz's app icon: the `b` from docs/baz-icon.svg, reversed out of the brand blue.

  The artwork is a single colour on nothing, which is right for a mark sitting in a page and
  wrong for an icon — a home screen composites it on whatever it likes, so the tile and the ink
  are both written out here. The glyph is the same geometry, scaled and centred; nothing about
  the drawing changes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Baz">
  <rect width="256" height="256" rx="56" fill="#0029F8"/>
  <g transform="translate(60,42) scale(2.14)">
    <circle cx="32" cy="40" r="24.5" fill="none" stroke="#FFFFFF" stroke-width="15"/>
    <circle cx="26" cy="37" r="3" fill="#FFFFFF"/>
    <circle cx="37" cy="37" r="3" fill="#FFFFFF"/>
    <path d="M0 7.5C0 3.35786 3.35786 0 7.5 0C11.6421 0 15 3.35786 15 7.5V40H0V7.5Z" fill="#FFFFFF"/>
  </g>
</svg>
